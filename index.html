<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quebra-Pedra</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Arquivo JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <main class="jogo">

        <h1>🔨 Quebra-Pedra</h1>

        <div class="informacoes">

            <div class="contador">
                ⏱️ Tempo:
                <span id="tempo">60</span>s
            </div>

            <div class="contador moedas">
                🪙 Moedas:
                <span id="moedas">0</span>
            </div>

        </div>

        <div class="fase">
            Fase: <strong id="fase">1</strong>
        </div>

        <div id="pedra" class="pedra">
            🪨
        </div>

        <div class="vida-container">
            <div id="vida"></div>
        </div>

        <p>
            Resistência:
            <strong id="resistencia">20</strong>
        </p>

        <button id="martelo" class="martelo">
            🔨 BATER NA PEDRA
        </button>

        <p id="mensagem">
            Clique no martelo para começar!
        </p>

    </main>

</body>

</html>
