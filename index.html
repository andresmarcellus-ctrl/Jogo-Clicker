                <!DOCTYPE html>
                <html lang="pt-BR">
                <head>
                    <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                            <title>Tela Inicial</title>
                                <style>
                                        /* Deixa a tela ocupando o espaço todo e centraliza o conteúdo */
                                                body {
                                                            margin: 0;
                                                                        height: 100vh;
                                                                                    display: flex;
                                                                                                justify-content: center;
                                                                                                            align-items: center;
                                                                                                                        background-color: #121212;
                                                                                                                                    font-family: Arial, sans-serif;
                                                                                                                                            }

                                                                                                                                                    /* Estilo do botão */
                                                                                                                                                            .btn-entrar {
                                                                                                                                                                        padding: 15px 40px;
                                                                                                                                                                                    font-size: 18px;
                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                            color: #ffffff;
                                                                                                                                                                                                                        background-color: #007BFF;
                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                border-radius: 8px;
                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                        transition: background-color 0.3s ease, transform 0.1s ease;
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                        /* Efeito quando o mouse passa por cima do botão */
                                                                                                                                                                                                                                                                                                .btn-entrar:hover {
                                                                                                                                                                                                                                                                                                            background-color: #0056b3;
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                            /* Efeito quando o botão é clicado */
                                                                                                                                                                                                                                                                                                                                    .btn-entrar:active {
                                                                                                                                                                                                                                                                                                                                                transform: scale(0.98);
                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                <!-- Botão centralizado -->
                                                                                                                                                                                                                                                                                                                                                                    <button class="btn-entrar" onclick="alert('Você entrou!')">ENTRAR</button>

                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                    </html>
